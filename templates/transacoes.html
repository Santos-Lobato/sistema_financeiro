{% extends "base.html" %}
{% block conteudo %}

<h1>Transações</h1>

<h2>Nova transação</h2>
<form action="/transacoes/cadastrar" method="POST">
    <input type="text" name="descricao" placeholder="Descrição" required>
    <input type="number" name="valor" placeholder="Valor" step="0.01" min="0.01" required>
    <input type="date" name="data" required>
    <select name="tipo">
        <option value="Receita">Receita</option>
        <option value="Despesa">Despesa</option>
    </select>
    <select name="categoria_id">
        {% for c in categorias %}
        <option value="{{ c[0] }}">{{ c[1] }} ({{ c[2] }})</option>
        {% endfor %}
    </select>
    <button type="submit">Cadastrar</button>
</form>

<h2>Lista de transações</h2>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Data</th>
            <th>Tipo</th>
            <th>Categoria</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for t in transacoes %}
        <tr>
            <td>{{ t[0] }}</td>
            <td>{{ t[1] }}</td>
            <td>R$ {{ "%.2f"|format(t[2]) }}</td>
            <td>{{ t[3] }}</td>
            <td>{{ t[4] }}</td>
            <td>{{ t[5] }}</td>
            <td>
                <form action="/transacoes/editar" method="POST">
                    <input type="hidden" name="id" value="{{ t[0] }}">
                    <input type="text" name="descricao" value="{{ t[1] }}" required>
                    <input type="number" name="valor" value="{{ t[2] }}" step="0.01" min="0.01" required>
                    <input type="date" name="data" value="{{ t[3] }}" required>
                    <select name="tipo">
                        <option value="Receita" {% if t[4] == "Receita" %}selected{% endif %}>Receita</option>
                        <option value="Despesa" {% if t[4] == "Despesa" %}selected{% endif %}>Despesa</option>
                    </select>
                    <select name="categoria_id">
                        {% for c in categorias %}
                        <option value="{{ c[0] }}" {% if c[0] == t[5] %}selected{% endif %}>{{ c[1] }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit">Salvar</button>
                </form>
                <form action="/transacoes/deletar" method="POST">
                    <input type="hidden" name="id" value="{{ t[0] }}">
                    <button type="submit">Deletar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
